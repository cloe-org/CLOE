name: Build and Push Docker Image

on:
  push:
    branches:
      - docsbranch
      - main

jobs:
  build-push:
    if: false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Determine whether we are on main (-> latest) or docsbranch (-> docsbranch)
      - name: Determine tag
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=docsbranch" >> $GITHUB_ENV
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/testarnyttnamn/cloecode:${{ env.IMAGE_TAG }}
