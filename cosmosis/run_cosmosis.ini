# WORKING DIRECTORY ASSUMED TO BE LIKELIHOOD-IMPLEMENTATION/cosmosis
[pipeline]
modules = camb euclid
values = cosmosis_values.ini
priors = cosmosis_priors.ini
likelihoods = cloe
timing = T

[runtime]
sampler = metropolis
verbosity = debug
resume = T

[output]
filename = ../chains/cosmosis_output.txt
format = text
lock = F

[metropolis]
samples = 100000

[camb]
file = camb_interface.py
feedback = 0
# Specify the cobaya config file (same file that will be used in the [euclid] section)
cloe_config_file = cobaya_config_for_cosmosis.yaml

[euclid]
file = cloe_interface.py
config_file = cobaya_config_for_cosmosis.yaml
