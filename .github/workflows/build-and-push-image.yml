name: Build and Push Docker Image

on:
  push:
    branches: [ docsbranch, master ]

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Determine tag
        run: |
          if [ "$GITHUB_REF" = "refs/heads/master" ]; then
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=ci-debug" >> $GITHUB_ENV
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # First run: image may not exist yet; ignore pull failure
      - name: Try to pull cache (ignore if missing)
        run: docker pull ghcr.io/testarnyttnamn/cloecode:${{ env.IMAGE_TAG }} || true

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/testarnyttnamn/cloecode:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=ghcr.io/testarnyttnamn/cloecode:${{ env.IMAGE_TAG }}
          cache-to: type=inline
